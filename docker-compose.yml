services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://your-backend-internal-url:8080
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api # Example for local development
    restart: unless-stopped
