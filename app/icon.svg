<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with 12px-style rounding (proportional) -->
  <rect width="512" height="512" rx="64" fill="#141414" />
  
  <!-- Blueprint Grid Layer -->
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#262626" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#grid)" />
  
  <!-- Border -->
  <rect x="0.5" y="0.5" width="511" height="511" rx="64" fill="none" stroke="#454545" stroke-width="1" />

  <!-- Monogram -->
  <text x="50%" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="280" letter-spacing="-15">
    <tspan fill="#FFFFFF">Fl</tspan><tspan fill="#b8b1ff">u</tspan>
  </text>
</svg>
