<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup 3: Neon Cyberpunk (High Contrast & Tech)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        body {
            font-family: 'Space Mono', monospace;
            background-color: #050505;
            color: #a3a3a3;
            overflow-x: hidden;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(to bottom, transparent 50%, rgba(255, 255, 255, 0.02) 51%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
        }

        .neon-border {
            border: 1px solid #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2), inset 0 0 10px rgba(0, 255, 204, 0.1);
            background: rgba(0, 255, 204, 0.05);
        }

        .word-item {
            transition: all 0.2s;
            cursor: crosshair;
        }

        .word-item:hover {
            text-shadow: 0 0 20px currentColor, 0 0 40px currentColor;
            transform: scale(1.1);
            z-index: 100;
            color: #fff !important;
        }

        .glitch-anim {
            animation: glitch 4s infinite alternate;
        }

        @keyframes glitch {

            0%,
            98%,
            100% {
                opacity: 1;
                transform: translate(0);
            }

            99% {
                opacity: 0.8;
                transform: translate(-2px, 2px);
            }
        }
    </style>
</head>

<body class="min-h-screen w-full flex flex-col pt-8 pb-4 px-6 md:px-12 relative border-x-4 border-[#00ffcc]/20">
    <div class="scanline"></div>

    <!-- Header: Terminal styled -->
    <header class="flex flex-col items-start gap-4 shrink-0 relative z-10 w-full mb-16 border-b border-[#333] pb-8">
        <div
            class="flex items-center justify-between w-full text-xs font-bold uppercase tracking-widest text-[#00ffcc]">
            <div class="flex gap-4">
                <span class="animate-pulse">● SYS_ONLINE</span>
                <span>// TTL: 25:14:09</span>
            </div>
            <div class="neon-border px-3 py-1 bg-black text-[#00ffcc]">ID: FLUX.XYZ</div>
        </div>
        <h1 class="text-3xl md:text-5xl font-bold tracking-tight text-white glitch-anim mt-2">
            > SELECT * FROM team_traits WHERE status = 'perfect';
        </h1>
    </header>

    <!-- Main Content: Strict data-like scatter but huge -->
    <main class="flex-1 flex flex-col items-center justify-center relative w-full h-full pb-10">
        <div class="w-full max-w-7xl mx-auto flex flex-wrap content-center items-center justify-center gap-x-8 gap-y-6"
            id="cloud">
            <!-- Words generated by JS -->
        </div>
    </main>

    <script>
        const words = [
            { w: 'Trust', count: 120 }, { w: 'Communication', count: 90 },
            { w: 'Empathy', count: 85 }, { w: 'Collaboration', count: 70 },
            { w: 'Respect', count: 65 }, { w: 'Support', count: 50 },
            { w: 'Transparency', count: 45 }, { w: 'Fun', count: 40 },
            { w: 'Accountability', count: 35 }, { w: 'Diversity', count: 30 },
            { w: 'Synergy', count: 25 }, { w: 'Agility', count: 20 },
            { w: 'Feedback', count: 18 }, { w: 'Focus', count: 15 },
            { w: 'Drive', count: 12 }, { w: 'Skill', count: 10 }
        ];

        const sorted = words.sort((a, b) => b.count - a.count);
        const centerWeighted = [];
        sorted.forEach((item, i) => { i % 2 === 0 ? centerWeighted.push(item) : centerWeighted.unshift(item); });

        const max = sorted[0].count;
        const container = document.getElementById('cloud');

        const colors = [
            'text-[#00ffcc] [text-shadow:0_0_20px_rgba(0,255,204,0.6)]', // Neon Cyan
            'text-[#ff00ff] [text-shadow:0_0_20px_rgba(255,0,255,0.6)]', // Neon Magenta
            'text-[#ffff00] [text-shadow:0_0_20px_rgba(255,255,0,0.6)]', // Neon Yellow
            'text-white', 'text-gray-400', 'text-gray-600'
        ];

        centerWeighted.forEach(item => {
            const weight = item.count / max;
            const size = 1.2 + (weight * 6);
            const opacity = Math.max(0.3, weight + 0.3);
            const rank = sorted.findIndex(w => w.w === item.w);
            const colorClass = colors[rank] || colors[colors.length - 1];

            const div = document.createElement('div');
            div.className = `word-item font-bold uppercase ${colorClass} text-center leading-none`;
            div.style.fontSize = `${size}rem`;
            div.style.opacity = opacity;
            // Add pseudo brackets for tech feel
            div.innerHTML = `<span class="opacity-30">[</span>${item.w}<span class="opacity-30">]</span>`;

            container.appendChild(div);
        });
    </script>
</body>

</html>
