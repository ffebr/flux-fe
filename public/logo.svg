<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Blueprint Grid (Subtle) -->
  <defs>
    <pattern id="logoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262626" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="200" fill="transparent" />
  
  <!-- Construction Lines (Academic/Tech feel) -->
  <line x1="20" y1="40" x2="580" y2="40" stroke="#454545" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="20" y1="160" x2="580" y2="160" stroke="#454545" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- Dimension arrows -->
  <path d="M 20 40 L 20 160" stroke="#b8b1ff" stroke-width="1" fill="none" />
  <circle cx="20" cy="40" r="2" fill="#b8b1ff" />
  <circle cx="20" cy="160" r="2" fill="#b8b1ff" />
  
  <!-- Coordinate label -->
  <text x="25" y="32" font-family="monospace" font-size="10" fill="#454545">Y:160px</text>

  <!-- Flux Branding -->
  <text x="60" y="145" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="120" letter-spacing="-6">
    <tspan fill="#FFFFFF">Flu</tspan><tspan fill="#b8b1ff">x</tspan>
  </text>
  
  <!-- Subtitle/Tagline -->
  <text x="360" y="145" font-family="monospace" font-size="14" font-weight="500" fill="#454545" letter-spacing="4">SYSTEM//ON</text>
</svg>
