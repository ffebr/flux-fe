<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup 2: Spatial Fluid (Immersive & Organic)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0F172A;
            color: white;
            overflow-x: hidden;
        }

        /* Full screen dynamic organic background */
        .fluid-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.4), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.4), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(59, 130, 246, 0.4), transparent 50%);
            filter: blur(80px);
            animation: breathe 15s infinite alternate ease-in-out;
        }

        @keyframes breathe {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.1);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-15px) rotate(1deg);
            }
        }

        .anim-float {
            animation: float 6s infinite ease-in-out;
        }

        .glass-badge {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .word-item {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: default;
        }

        .word-item:hover {
            transform: scale(1.15) !important;
            z-index: 50 !important;
            filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.5));
            opacity: 1 !important;
            color: white !important;
        }
    </style>
</head>

<body class="min-h-screen w-full flex flex-col pt-10 pb-4 px-6 md:px-12 relative">
    <div class="fluid-bg"></div>

    <!-- Header: Completely boundless, floating widgets -->
    <header class="flex flex-col md:flex-row items-center justify-between gap-6 shrink-0 relative z-10 w-full mb-12">
        <h1
            class="text-4xl md:text-6xl font-black tracking-tight leading-tight max-w-4xl drop-shadow-lg text-transparent bg-clip-text bg-gradient-to-r from-white to-white/70">
            What describes a perfect team?
        </h1>
        <div class="flex items-center gap-4">
            <div class="glass-badge px-6 py-3 rounded-full flex items-center gap-3 font-semibold text-sm shadow-xl">
                <div class="w-3 h-3 bg-green-400 rounded-full shadow-[0_0_15px_rgba(74,222,128,0.8)] animate-pulse">
                </div> Active
            </div>
            <div
                class="glass-badge px-6 py-3 rounded-full flex gap-3 font-semibold text-sm shadow-xl hover:bg-white/20 transition-colors cursor-pointer">
                <span class="opacity-70">Share ID:</span> <span class="tracking-wider">XYZ-123</span>
            </div>
        </div>
    </header>

    <!-- Main Content: Floating softly in the center -->
    <main class="flex-1 flex flex-col items-center justify-center relative w-full h-full pb-10">
        <div class="w-[90%] mx-auto flex flex-wrap content-center items-center justify-center gap-x-6 gap-y-4"
            id="cloud">
            <!-- Words generated by JS to simulate cluster -->
        </div>
    </main>

    <script>
        const words = [
            { w: 'Trust', count: 120 }, { w: 'Communication', count: 90 },
            { w: 'Empathy', count: 85 }, { w: 'Collaboration', count: 70 },
            { w: 'Respect', count: 65 }, { w: 'Support', count: 50 },
            { w: 'Transparency', count: 45 }, { w: 'Fun', count: 40 },
            { w: 'Accountability', count: 35 }, { w: 'Diversity', count: 30 },
            { w: 'Synergy', count: 25 }, { w: 'Agility', count: 20 },
            { w: 'Feedback', count: 18 }, { w: 'Focus', count: 15 },
            { w: 'Drive', count: 12 }, { w: 'Skill', count: 10 }
        ];

        const sorted = words.sort((a, b) => b.count - a.count);
        const centerWeighted = [];
        sorted.forEach((item, i) => { i % 2 === 0 ? centerWeighted.push(item) : centerWeighted.unshift(item); });

        const max = sorted[0].count;
        const container = document.getElementById('cloud');

        const colors = [
            'text-white drop-shadow-[0_0_40px_rgba(255,255,255,0.8)]',
            'text-pink-300 drop-shadow-[0_0_20px_rgba(236,72,153,0.5)]',
            'text-purple-300 drop-shadow-[0_0_20px_rgba(168,85,247,0.5)]',
            'text-blue-300 drop-shadow-[0_0_20px_rgba(59,130,246,0.5)]',
            'text-white/80', 'text-white/60', 'text-white/40'
        ];

        centerWeighted.forEach(item => {
            const weight = item.count / max;
            const size = 1.5 + (weight * 7);
            const opacity = Math.max(0.4, weight + 0.4);
            const rank = sorted.findIndex(w => w.w === item.w);
            const colorClass = colors[rank] || colors[colors.length - 1];
            const delay = `${Math.random() * 2}s`;

            const wrapper = document.createElement('div');
            wrapper.className = `anim-float relative`;
            wrapper.style.animationDelay = delay;
            wrapper.style.zIndex = Math.floor(weight * 100);

            const div = document.createElement('div');
            div.className = `word-item font-black tracking-tight ${colorClass} text-center leading-[0.85]`;
            div.style.fontSize = `${size}rem`;
            div.style.opacity = opacity;
            div.innerText = item.w;

            wrapper.appendChild(div);
            container.appendChild(wrapper);
        });
    </script>
</body>

</html>
