<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup 1: Swiss Typographic (Minimal & Functional)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F4F4F0; color: #111; overflow-x: hidden; }
        .swiss-grid { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 4px solid #111; padding-bottom: 2rem; }
        .word-item { transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1); cursor: default; }
        .word-item:hover { transform: scale(1.05) rotate(-2deg); color: #EB3324; }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col p-8 md:p-12">
    <!-- Header: Strict, grid-based, functional -->
    <header class="swiss-grid gap-8 items-end mb-16 shrink-0 relative z-10">
        <div>
            <div class="text-sm font-bold uppercase tracking-widest mb-4 flex items-center gap-3">
                <div class="w-3 h-3 bg-[#EB3324] rounded-full animate-pulse"></div> Live Session
            </div>
            <h1 class="text-6xl md:text-8xl font-black leading-none tracking-tighter uppercase max-w-4xl">
                What describes a perfect team?
            </h1>
        </div>
        <div class="flex flex-col items-end gap-2 text-right">
            <div class="text-2xl font-bold">148 Responses</div>
            <div class="text-lg font-medium opacity-60">Expires in 25:14</div>
            <div class="mt-4 border-2 border-[#111] p-4 font-bold text-center inline-block">
                flux.app/join/xyz
            </div>
        </div>
    </header>

    <!-- Main Content: No bounds, full bleed clustered words -->
    <main class="flex-1 flex items-center justify-center relative w-full h-full pb-20">
        <div class="max-w-[90%] mx-auto flex flex-wrap content-center items-center justify-center gap-6" id="cloud">
            <!-- Words generated by JS to simulate cluster -->
        </div>
    </main>

    <script>
        const words = [
            { w: 'Trust', count: 120 }, { w: 'Communication', count: 90 },
            { w: 'Empathy', count: 85 }, { w: 'Collaboration', count: 70 },
            { w: 'Respect', count: 65 }, { w: 'Support', count: 50 },
            { w: 'Transparency', count: 45 }, { w: 'Fun', count: 40 },
            { w: 'Accountability', count: 35 }, { w: 'Diversity', count: 30 },
            { w: 'Synergy', count: 25 }, { w: 'Agility', count: 20 },
            { w: 'Feedback', count: 18 }, { w: 'Focus', count: 15 },
            { w: 'Drive', count: 12 }, { w: 'Skill', count: 10 }
        ];

        // Sort largest to center logic
        const sorted = words.sort((a,b) => b.count - a.count);
        const centerWeighted = [];
        sorted.forEach((item, i) => { i % 2 === 0 ? centerWeighted.push(item) : centerWeighted.unshift(item); });

        const max = sorted[0].count;
        const container = document.getElementById('cloud');

        centerWeighted.forEach(item => {
            const weight = item.count / max;
            const size = 2 + (weight * 9); // Huge extreme fonts up to 11rem
            const opacity = Math.max(0.4, weight + 0.3);
            
            const div = document.createElement('div');
            div.className = 'word-item font-black tracking-tighter leading-[0.85]';
            div.style.fontSize = `${size}rem`;
            div.style.opacity = opacity;
            div.innerText = item.w;
            container.appendChild(div);
        });
    </script>
</body>
</html>
